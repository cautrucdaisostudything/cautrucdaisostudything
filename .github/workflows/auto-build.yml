name: Auto Build index.html from src

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build.py to bundle src/ into index.html
        run: python3 build.py

      - name: Commit updated index.html back to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-build index.html from modular src/" && git push)
