<section id="slideWorkspace" aria-label="Trình chiếu slide bài giảng">
  <div class="slide-toolbar">
    <label for="slideChapterSelect">Chương
      <select id="slideChapterSelect" aria-label="Chọn chương trình chiếu">
        <option value="0">Chương 0 — Ngôn ngữ và Công cụ</option>
        <option value="1" selected>Chương 1 — Cấu trúc Nhóm</option>
        <option value="2">Chương 2 — Nhóm con &amp; Nhóm cyclic</option>
        <option value="3">Chương 3 — Lớp kề &amp; Lagrange</option>
        <option value="4">Chương 4 — Chuẩn tắc &amp; Nhóm thương</option>
        <option value="5">Chương 5 — Đồng cấu &amp; Đẳng cấu</option>
        <option value="6">Chương 6 — Vành, miền nguyên &amp; Trường</option>
        <option value="7">Chương 7 — Iđêan &amp; Vành thương</option>
        <option value="8">Chương 8 — Đồng cấu vành &amp; Đặc số</option>
        <option value="9">Chương 9 — Trường các thương Frac(R)</option>
      </select>
    </label>
    <button type="button" class="slide-filmstrip-toggle" id="slideFilmstripToggle" aria-expanded="true" aria-controls="slideFilmstrip" title="Thu gọn danh sách slide">◧ Danh sách slide</button>
    <button type="button" class="slide-fs-btn" id="slideFullscreen">⛶ Toàn màn hình</button>
  </div>
  <div class="slide-presentation-layout" id="slidePresentationLayout">
    <aside class="slide-filmstrip" id="slideFilmstrip" aria-label="Danh sách slide">
      <ol class="slide-filmstrip-list" id="slideFilmstripList"></ol>
    </aside>
    <div class="slide-stage-frame" id="slideStageFrame">
      <div class="slide-stage" id="slideStage">
        <article class="slide-card" id="slideCard" aria-live="polite"></article>
      </div>
    </div>
  </div>
  <div class="slide-controls">
    <button type="button" class="slide-nav-btn" id="slidePrev">← Trước</button>
    <button type="button" class="slide-nav-btn" id="slideNext">Tiếp theo →</button>
    <span id="slideCounter">Slide 1 / 1</span>
    <div class="slide-progress" aria-hidden="true"><span id="slideProgressBar"></span></div>
  </div>
  <p class="slide-keys"><kbd>←</kbd> <kbd>→</kbd> hoặc <kbd>Space</kbd> chuyển slide · <kbd>F</kbd> toàn màn hình · <kbd>Esc</kbd> thoát toàn màn hình</p>
</section>
